- name: create ec2 instance
  hosts: local
  connection: local
  become: yes
  vars:
    ami_id: ami-09c813fb71547fc4f
    sg_ig: sg-047ef728b9f81c7e7
    zone_id: use1-az1
    domain_name: dopsaws.fun
    instances:
    - mongodb
    tasks:
    - name: start an instance with a public IP address
      amazon.aws.ec2_instance:
        name: "{{ item }}"
        instance_type: t3.micro
        security_group: "{{ sg_id }}"
        image_id: "{{ ami_id }}"
        tags:
          name: "{{ item }}"

      loop: "{{ instances }}"
      register: ec2_output
      overwrite: true
    - name: ec2 output
      ansible.builtin.debug:
        msg: "{{ ec2_output }}"
